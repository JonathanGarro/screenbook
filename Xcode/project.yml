name: ScreenbookApps
options:
  bundleIdPrefix: io.github.jonathangarro
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  Screenbook:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: WAFG79SSX5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  ScreenbookProvisioning:
    type: application
    platform: macOS
    sources: [Provisioning/main.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jonathangarro.screenbook
        PRODUCT_NAME: Screenbook
        CODE_SIGN_ENTITLEMENTS: Provisioning/Screenbook.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
  ScreenbookPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../iOS
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: Screenbook
        product: WatchlistCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jonathangarro.screenbook
        PRODUCT_NAME: Screenbook
        CODE_SIGN_ENTITLEMENTS: ../iOS/Screenbook.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screenbook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ../iOS/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
